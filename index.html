<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THINKLOPEDIA · Topic Swipe</title>
<meta name="description" content="Swipe THINKLOPEDIA video topics: right to approve, left to reject.">
<meta name="theme-color" content="#0A0C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Topics">
<meta property="og:title" content="THINKLOPEDIA · Topic Swipe">
<meta property="og:description" content="Swipe right to approve, left to reject. Think deeper.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preload" href="fonts/Montserrat-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <img src="icons/mark.svg" alt="" class="mark" width="34" height="34">
      <div class="brandtext"><div class="word">THINKLOPEDIA</div><div class="sub">Topic swipe</div></div>
    </div>
    <button class="send" id="sendBtn" type="button" aria-label="Send picks to Rika">
      <span class="send-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3L3 11.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span>
      <span>Send to Rika</span><span class="badge" id="sendBadge" hidden>0</span>
    </button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="pending" class="tab on">Pending <b id="cPending">0</b></button>
    <button role="tab" data-tab="approved" class="tab">Approved <b id="cApproved">0</b></button>
    <button role="tab" data-tab="rejected" class="tab">Rejected <b id="cRejected">0</b></button>
    <span class="tab-ink" id="tabInk"></span>
  </nav>

  <main id="view-pending" class="view on">
    <div class="filters" role="group" aria-label="Format">
      <button class="chip on" data-f="all">All</button><button class="chip" data-f="Short">Shorts</button><button class="chip" data-f="Long">Long videos</button>
      <span class="later-note" id="laterNote" hidden></span>
    </div>
    <div class="deck" id="deck" aria-live="polite"></div>
    <div class="actions">
      <button class="act undo" id="undoBtn" type="button" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="act no" id="noBtn" type="button" aria-label="Reject"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <button class="act later" id="laterBtn" type="button" aria-label="Later"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="act yes" id="yesBtn" type="button" aria-label="Approve"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="act info" id="infoBtn" type="button" aria-label="Details"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <p class="hint">Swipe <b class="g">right</b> approve · <b class="r">left</b> reject · <b class="a">up</b> later</p>
  </main>

  <main id="view-approved" class="view list-view"><div class="list" id="listApproved"></div></main>
  <main id="view-rejected" class="view list-view"><div class="list" id="listRejected"></div></main>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<label class="haptic" aria-hidden="true"><input type="checkbox" switch id="hapticSwitch" tabindex="-1"></label>
<script src="app.js?v=1"></script>
</body>
</html>
